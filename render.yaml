services:
  - type: web
    name: rushd-app
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PUBLIC_DEMO_MODE
        value: "1"
      - key: AUTH_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rushd-db
          property: connectionString

  # One after-close job keeps the authoritative InternalSim forward test automatic for $1/month
  # (Render's minimum cron charge), instead of paying for three separate schedulers.
  - type: cron
    name: rushd-quant-daily
    runtime: node
    plan: starter
    region: oregon
    schedule: "30 21 * * 1-5"
    buildCommand: "true"
    startCommand: node scripts/run-quant-daily.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RUSHD_APP_URL
        sync: false
      - key: CRON_SECRET
        sync: false

databases:
  - name: rushd-db
    plan: starter
